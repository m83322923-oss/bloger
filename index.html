<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت‌نام قرعه‌کشی</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="navbar">
        <div class="logo">✦ قرعه‌کشی بزرگ</div>
        <span class="nav-label">ورود به مسابقه</span>
    </header>

    <main class="hero">

        <section class="banner">
            <img
                src="photo_2026-10-13_18-45-29.jpg"
                alt="بنر قرعه‌کشی"
                class="banner-image"
            >
        </section>

        <section class="register-card">

            <div class="icon-box">♙</div>

            <h1>ثبت‌نام در قرعه‌کشی</h1>

            <p class="subtitle">
                اطلاعاتت رو وارد کن و در قرعه‌کشی شرکت کن!
            </p>

            <form id="registerForm">

                <div class="input-group">
                    <label for="fullName">نام و نام خانوادگی</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="نام کامل خود را وارد کنید"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="phone">شماره موبایل</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09123456789"
                        inputmode="numeric"
                        autocomplete="tel-national"
                        pattern="09[0-9]{9}"
                        maxlength="11"
                        required
                    >
                </div>
<div class="captcha-section">
  <label for="captchaInput">کد امنیتی را وارد کنید</label>  <div class="captcha-row">
    <canvas id="captchaCanvas" width="150" height="50"
      aria-label="تصویر کد امنیتی"></canvas><button type="button" id="refreshCaptcha"
  class="refresh-captcha" aria-label="ساخت کد جدید">
  ↻
</button>

  </div><input
type="text"
id="captchaInput"
placeholder="کد داخل تصویر"
maxlength="6"
autocomplete="off"
required

«»

  <p id="captchaMessage" class="captcha-message"
    role="status" aria-live="polite"></p>
</div>
                <button type="submit" class="submit-btn">
                    ثبت‌نام در قرعه‌کشی
                    <span>←</span>
                </button>

                <p id="message" class="message" role="status" aria-live="polite"></p>

            </form>

            <div class="privacy">
                🔒 از اطلاعات شما محافظت می‌شود.
            </div>

        </section>

    </main>

    <footer>
        طراحی‌شده با ❤️ برای شرکت‌کنندگان
    </footer>

    <script>
        const form = document.getElementById("registerForm");
        const phone = document.getElementById("phone");
        const message = document.getElementById("message");

        phone.addEventListener("input", () => {
            phone.value = phone.value.replace(/\D/g, "").slice(0, 11);
        });

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            message.textContent =
                "ظاهر فرم آماده است؛ برای ثبت‌نام واقعی باید سرور را متصل کنیم.";

            message.className = "message info";
        });
       

document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("registrationForm");
    const canvas = document.getElementById("captchaCanvas");
    const captchaInput = document.getElementById("captchaInput");
    const captchaMessage = document.getElementById("captchaMessage");
    const refreshButton = document.getElementById("refreshCaptcha");

    const fullNameInput = document.getElementById("fullName");
    const phoneInput = document.getElementById("phone");

    // بررسی وجود عناصر ضروری
    if (!form || !canvas || !captchaInput || !captchaMessage) {
        console.error("یکی از عناصر فرم یا کد امنیتی پیدا نشد.");
        return;
    }

    const ctx = canvas.getContext("2d");

    if (!ctx) {
        console.error("مرورگر امکان ساخت تصویر CAPTCHA را ندارد.");
        return;
    })

    let captchaCode = "";

    // ساخت کد امنیتی جدید
    function generateCaptcha() {
        const characters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        captchaCode = "";

        for (let i = 0; i < 6; i++) {
            captchaCode += characters[
                Math.floor(Math.random() * characters.length)
            ];
        })

        // پس‌زمینه
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f3edff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // خطوط مزاحم
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.strokeStyle = hsl(${Math.random() * 360}, 60%, 60%);
            ctx.lineWidth = 1;

            ctx.moveTo(
                Math.random() * canvas.width,
                Math.random() * canvas.height
            );

            ctx.lineTo(
                Math.random() * canvas.width,
                Math.random() * canvas.height
            );

            ctx.stroke();
        }

        // رسم حروف
        ctx.font = "bold 25px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (let i = 0; i < captchaCode.length; i++) {
            ctx.save();

            ctx.translate(18 + i * 23, canvas.height / 2);
            ctx.rotate((Math.random() - 0.5) * 0.25);

            ctx.fillStyle = "#241448";
            ctx.fillText(captchaCode[i], 0, 0);

            ctx.restore();
        }

        captchaInput.value = "";
        captchaMessage.textContent = "";
        captchaMessage.className = "captcha-message";
    }

    // بررسی کد واردشده
    function validateCaptcha() {
        const enteredCode = captchaInput.value.trim().toUpperCase();

        if (enteredCode !== captchaCode) {
            captchaMessage.textContent =
                "کد امنیتی اشتباه است. لطفاً دوباره تلاش کنید.";

            captchaMessage.className = "captcha-message error";

            generateCaptcha();
            return false;
        }

        captchaMessage.textContent = "کد امنیتی صحیح است.";
        captchaMessage.className = "captcha-message success";

        return true;
    }

    // تولید مجدد کد با کلیک روی دکمه
    if (refreshButton) {
        refreshButton.addEventListener("click", generateCaptcha);
    }

    // بررسی فرم ثبت‌نام
    form.addEventListener("submit", (event) => {
        event.preventDefault();

        const fullName = fullNameInput
            ? fullNameInput.value.trim()
            : "";

        const phone = phoneInput
            ? phoneInput.value.trim()
            : "";

        if (!fullName || !phone) {
            alert("لطفاً نام و شماره موبایل خود را وارد کنید.");
            return;
        }

        // بررسی قالب شماره موبایل ایران
        if (!/^09\d{9}$/.test(phone)) {
            alert("شماره موبایل باید ۱۱ رقم و با 09 شروع شود.");
            return;
        }

        // بررسی کد امنیتی
        if (!validateCaptcha()) {
            return;
        }

        // این نسخه فقط نمایشی است و اطلاعات را ذخیره نمی‌کند.
        alert(
            "کد امنیتی صحیح است!\n\n" +
            "نمونه اولیه فرم با موفقیت بررسی شد.\n" +
            "برای ثبت‌نام واقعی باید سرور متصل شود."
        );
</script>


</body>
</html>
