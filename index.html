<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت‌نام قرعه‌کشی</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="navbar">
        <div class="logo">✦ قرعه‌کشی بزرگ</div>
        <span class="nav-label">ورود به مسابقه</span>
    </header>

    <main class="hero">

        <section class="banner">
            <img
                src="photo_2026-10-13_18-45-29.jpg"
                alt="بنر قرعه‌کشی"
                class="banner-image"
            >
        </section>

        <section class="register-card">

            <div class="icon-box">♙</div>

            <h1>ثبت‌نام در قرعه‌کشی</h1>

            <p class="subtitle">
                اطلاعاتت رو وارد کن و در قرعه‌کشی شرکت کن!
            </p>

            <form id="registerForm">

                <div class="input-group">
                    <label for="fullName">نام و نام خانوادگی</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="نام کامل خود را وارد کنید"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >
                </div>
                <label for="instagram">آیدی اینستاگرام</label>
<input
    type="text"
    id="instagram"
    name="instagram"
    placeholder="مثلاً: @your_username"
    maxlength="30"
    autocomplete="off"
    required
>
                <div class="input-group">
                    <label for="phone">شماره موبایل</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09123456789"
                        inputmode="numeric"
                        autocomplete="tel-national"
                        pattern="09[0-9]{9}"
                        maxlength="11"
                        required
                    >
                </div>
<div class="captcha-section">
  <label for="captchaInput">کد امنیتی را وارد کنید</label>  <div class="captcha-row">
    <canvas id="captchaCanvas" width="150" height="50"
      aria-label="تصویر کد امنیتی"></canvas><button type="button" id="refreshCaptcha"
  class="refresh-captcha" aria-label="ساخت کد جدید">
  ↻
</button>

  </div><input
type="text"
id="captchaInput"
placeholder="کد داخل تصویر"
maxlength="6"
autocomplete="off"
required

«»

  <p id="captchaMessage" class="captcha-message"
    role="status" aria-live="polite"></p>
</div>
                <button type="submit" class="submit-btn">
                    ثبت‌نام در قرعه‌کشی
                    <span>←</span>
                </button>

                <p id="message" class="message" role="status" aria-live="polite"></p>

            </form>

            <div class="privacy">
                🔒 از اطلاعات شما محافظت می‌شود.
            </div>

        </section>

    </main>

    <footer>
        طراحی‌شده با ❤️ برای شرکت‌کنندگان
    </footer>

    <script>
        const form = document.getElementById("registerForm");
        const phone = document.getElementById("phone");
        const message = document.getElementById("message");

        phone.addEventListener("input", () => {
            phone.value = phone.value.replace(/\D/g, "").slice(0, 11);
        });

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            message.textContent =
                "ظاهر فرم آماده است؛ برای ثبت‌نام واقعی باید سرور را متصل کنیم.";

            message.className = "message info";
        });
       

document.addEventListener("DOMContentLoaded", function () {
  const canvas = document.getElementById("captchaCanvas");

  if (!canvas) {
    console.error("Canvas کد امنیتی در HTML پیدا نشد.");
    return;
  }

  const ctx = canvas.getContext("2d");

  if (!ctx) {
    console.error("امکان ساخت تصویر کد امنیتی وجود ندارد.");
    return;
  }

  let code = "";

  function generateCaptcha() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    code = "";

    for (let i = 0; i < 6; i++) {
      code += chars[Math.floor(Math.random() * chars.length)];
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#f3edff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = "bold 25px Arial";
    ctx.fillStyle = "#241448";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(code, canvas.width / 2, canvas.height / 2);
  }

  const refreshButton = document.getElementById("refreshCaptcha");

  if (refreshButton) {
    refreshButton.addEventListener("click", generateCaptcha);
  }

  generateCaptcha();
});


</script>


</body>
</html>
